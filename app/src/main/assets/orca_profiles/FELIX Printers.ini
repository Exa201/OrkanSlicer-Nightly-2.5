machine_end_gcode = ; FELIX Food Switch - OrcaSlicer End G-code - V1.00\nG92 E0\nG1 E-{retraction_length[0]} F{retraction_speed[0]*60} S0\nG92 E0\nG91\nG1 Z10 F1200\nG90\nG28 X\nG28 Y\nM107\nM84\n
