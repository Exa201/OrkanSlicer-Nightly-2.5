[printer:fdm_machine_common]
gcode_flavor = reprapfirmware
machine_start_gcode = M109 S[nozzle_temperature_initial_layer]\nG1 Z10 F6000 ;Move the platform down 10mm\nG1 X60 Y10 F10000\nG1 Z0.25 F6000 ;Move the platform down 0,25mm\nG92 E0\nG1 X200 E20 F1000\nG1 X450 E40 F1000\nG92 E0
machine_end_gcode = {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+1, max_print_height)} F720 ; Move print head up{endif}\nG1 X0 Y200 F3600 ; park\n{if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+49, max_print_height)} F720 ; Move print head further up{endif}\nM221 S100 ; reset flow\nM900 K0 ; reset LA\nM104 S0 ; turn off temperature\nM140 S0 ; turn off heatbed\nM107 ; turn off fan\nM84 ; disable motors
extruder_colour = #FCE94F
extruder_offset = 0x0
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 500,20000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 2500,20000
machine_max_acceleration_x = 2000,20000
machine_max_acceleration_y = 2000,20000
machine_max_acceleration_z = 200,200
machine_max_speed_e = 500,25
machine_max_speed_x = 200,200
machine_max_speed_y = 200,200
machine_max_speed_z = 12,12
machine_max_jerk_e = 2.5,2.5
machine_max_jerk_x = 5,5
machine_max_jerk_y = 5,5
machine_max_jerk_z = 0.2,0.4
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
max_layer_height = 0.32
min_layer_height = 0.1
printable_height = 500
extruder_clearance_radius = 65
extruder_clearance_height_to_rod = 36
extruder_clearance_height_to_lid = 140
nozzle_diameter = 0.4
printer_technology = FFF
printer_variant = 0.4
retraction_minimum_travel = 1
retract_before_wipe = 70%
retract_when_changing_layer = 0
retraction_length = 1.6
retract_length_toolchange = 2
z_hop = 0.2
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
retraction_speed = 45
deretraction_speed = 45
single_extruder_multi_material = 1
before_layer_change_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0\n
layer_change_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_pause_gcode = M601
wipe = 0
printer_settings_id = fdm_machine_common

