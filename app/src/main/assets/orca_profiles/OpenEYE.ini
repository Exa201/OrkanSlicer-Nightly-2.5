[printer_model:OpenEYE Peacock V2]
name = OpenEYE Peacock V2
nozzle_diameter = 0.4;0.2;0.6;0.8
url = http://www.openeye.tech
bed_model = Plate.stl
default_bed_type = Textured PEI Plate
family = OpenEYE
